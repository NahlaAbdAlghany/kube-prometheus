apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-k8s
  namespace: monitoring
spec:
  ingress:
  # Add rule for external access (no 'from' selector = allow all)
  - ports:
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 8080
  # Existing internal cluster rules
  - ports:
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 8080
    from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
  - ports:
    - protocol: TCP
      port: 9090
    from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus-adapter
  - ports:
    - protocol: TCP
      port: 9090
    from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana